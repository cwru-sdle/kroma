name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev,docs]"
      - run: pytest -q
      - run: pytest -q --doctest-modules src/kroma/agents/utils.py src/kroma/algorithms/utils.py src/kroma/metrics/scoring.py src/kroma/retrieval/vector_store.py src/kroma/costs.py src/kroma/decorators.py src/kroma/tasks/prompts/builders.py src/kroma/matcher.py src/kroma/ontology.py
      - run: sphinx-build -W --keep-going -b html docs/source docs/build/html
