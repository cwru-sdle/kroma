[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kroma-om"
version = "0.3.1"
description = "Ontology matching with knowledge retrieval and large language models"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Lam Nguyen" },
  { name = "Erika Barcelos" },
  { name = "Roger French" },
  { name = "Yinghui Wu" },
]
license = "BSD-3-Clause"
keywords = ["ontology matching", "ontology alignment", "knowledge graphs", "large language models", "retrieval-augmented generation", "semantic web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy",
  "python-dotenv",
  "rdflib",
  "requests",
  "scipy",
]

[project.optional-dependencies]
models = [
  "nltk",
  "networkx",
  "node2vec",
  "setuptools<82",  # node2vec imports pkg_resources, which setuptools 82 removed
  "openai",
  "scikit-learn",
  "scipy",
  "sentence-transformers",
  "SPARQLWrapper",
  "together",
  "torch",
  "transformers",
]
dev = ["pytest"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]

[project.scripts]
kroma = "kroma.cli:main"

[project.urls]
Homepage = "https://github.com/cwru-sdle/kroma"
Documentation = "https://kroma.readthedocs.io/en/latest/"
Repository = "https://github.com/cwru-sdle/kroma"
Issues = "https://github.com/cwru-sdle/kroma/issues"
Paper = "https://doi.org/10.1007/978-3-032-09527-5_34"
arXiv = "https://arxiv.org/abs/2507.14032"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kroma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
